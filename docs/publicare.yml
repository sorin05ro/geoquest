# Publică GeoQuest la fiecare modificare salvată în ramura main:
# verifică conținutul, rulează testele, construiește aplicația și o pune în ramura gh-pages (GitHub Pages).
name: Publicare pe GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check-content
      - run: npm test
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
